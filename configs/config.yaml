project:
  name: network-intrusion-triage
  seed: 42

paths:
  raw_train: data/raw/UNSW_NB15_training-set.parquet
  raw_test: data/raw/UNSW_NB15_testing-set.parquet
  processed_dir: data/processed
  figures_dir: reports/figures
  metrics_file: reports/metrics.json
  best_model: models/best_model.joblib

sampling:
  max_train_rows: null
  max_test_rows: null

schema:
  target_col: label
  drop_cols:
    - attack_cat
  categorical_cols:
    - proto
    - service
    - state
  numeric_cols:
    - dur
    - spkts
    - dpkts
    - sbytes
    - dbytes
    - rate
    - sload
    - dload
    - sloss
    - dloss
    - sinpkt
    - dinpkt
    - sjit
    - djit
    - swin
    - stcpb
    - dtcpb
    - dwin
    - tcprtt
    - synack
    - ackdat
    - smean
    - dmean
    - trans_depth
    - response_body_len
    - ct_src_dport_ltm
    - ct_dst_sport_ltm
    - is_ftp_login
    - ct_ftp_cmd
    - ct_flw_http_mthd
    - is_sm_ips_ports

models:
  logistic_regression:
    max_iter: 1000
    C: 1.0
  random_forest:
    n_estimators: 120
    max_depth: 18
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 150
    learning_rate: 0.1
    max_depth: 10
    class_weight: balanced

evaluation:
  priority_metric: recall
